<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="{{meta_description}}">
<link id="dynamicFavicon" rel="icon" type="image/svg+xml" href="{{favicon_href}}">
<title>{{title}}</title>
<!-- SPLIT_LINK_CSS -->
<style>{{css}}</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header class="topbar">
  <button class="icon-btn mobile-nav" id="navBtn" aria-label="Toggle navigation">☰</button>
  <div class="brand">
    {{logo_svg}}
    <span>{{title}}</span>
  </div>
  <button class="icon-btn search-toggle" id="searchToggle" type="button" aria-label="Search" aria-expanded="false" title="Search">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
  </button>
  <div class="search-box">
    <input class="search" id="search" type="text" placeholder="Search document…" aria-label="Search document">
    <button class="search-clear" id="clearSearchBtn" type="button" aria-label="Clear search" title="Clear search">×</button>
    <button class="search-opt" id="caseBtn" type="button" aria-label="Toggle case sensitivity" title="Match case">Aa</button>
    <button class="search-nav" id="prevBtn" type="button" aria-label="Previous match" title="Previous match">↑</button>
    <button class="search-nav" id="nextBtn" type="button" aria-label="Next match" title="Next match">↓</button>
  </div>
  <div class="toolbar">
    <span class="search-count" id="searchCount"></span>

    </button>
    <button class="tool-btn icon-only" id="settingsBtn" title="Customize appearance" aria-label="Customize appearance">
      <svg class="icon-accent" width="17" height="17" viewBox="0 0 801 774" fill="none" stroke="currentColor" stroke-width="50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

        <ellipse cx="310.52" cy="538.027" rx="57.8814" ry="55.5669"/>
      </svg>

  </div>
</header>

<div class="settings" id="settings">
  <h3>Appearance</h3>
  <div class="setting-row color-row">
    <span>Accent color</span>
    <label class="rainbow-picker" title="Choose any accent color">
      <span class="rainbow-ring"></span>
      <input id="colorPicker" type="color" value="#3b82f6" aria-label="Custom accent color">
    </label>
  </div>
  <div class="swatches" id="swatches">
    <button class="swatch" data-color="#3b82f6" style="background:#3b82f6" aria-label="Blue"></button>
    <button class="swatch" data-color="#8b5cf6" style="background:#8b5cf6" aria-label="Violet"></button>
    <button class="swatch" data-color="#06b6d4" style="background:#06b6d4" aria-label="Cyan"></button>
    <button class="swatch" data-color="#10b981" style="background:#10b981" aria-label="Green"></button>
    <button class="swatch" data-color="#f59e0b" style="background:#f59e0b" aria-label="Amber"></button>
    <button class="swatch" data-color="#f43f5e" style="background:#f43f5e" aria-label="Rose"></button>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <ul class="toc" id="toc"></ul>
  </aside>
  <main class="main">
    <article class="article" id="article">
      {{hero}}
      <div class="no-results" id="noResults">No matching content found.</div>
      {{body}}
    </article>
  </main>
</div>

<div class="nav-history-bar" id="navHistoryBar" hidden>
  <button class="nav-clear-btn" id="navClearBtn" aria-label="Clear navigation history" title="Clear history">×</button>
  <button class="nav-history-btn back" id="navBackBtn" aria-label="Go back" title="Go back (Alt+Left)">
    <span class="nav-arrow">←</span> <span class="nav-label" id="navBackLabel">Back</span>
  </button>
  <button class="nav-history-btn forward" id="navForwardBtn" aria-label="Go forward" title="Go forward (Alt+Right)" hidden>
    <span class="nav-label" id="navForwardLabel">Forward</span> <span class="nav-arrow">→</span>
  </button>
</div>

<button class="backtop" id="backtop" aria-label="Back to top">↑</button>

<!-- SPLIT_SCRIPT_SRC -->
<script>{{js}}</script>
</body>
</html>
